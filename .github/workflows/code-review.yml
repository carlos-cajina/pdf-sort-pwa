name: OpenCodeReview PR Review

# AI-powered PR review using Alibaba's OpenCodeReview composite action.
# Docs: https://github.com/alibaba/open-code-review
#
# LLM configuration (repository secrets: Settings -> Secrets and variables -> Actions)
#
#   OCR_LLM_URL         = https://opencode.ai/inference/go/openai/v1/chat/completions
#   OCR_LLM_AUTH_TOKEN  = a Console API key (oc_sk_...) — Account -> Personal API keys
#                         in https://opencode.ai/console. The OpenCode CLI key is NOT
#                         accepted by this gateway.
#   OCR_LLM_MODEL       = beam-free            (free, unlimited)
#                         or any Go model: kimi-k2.7-code, glm-5.3-flash, minimax-m3.1-flash, ...
#
# The x-opencode-session header is sent through llm_extra_headers below — the
# Go gateway rejects requests without it (HTTP 400 MissingSessionID). A custom
# User-Agent must NOT be added here: OCR reserves that header and errors out
# ("extra header conflicts with a reserved header"); OCR's own User-Agent
# already satisfies the gateway.
#
# Until the secrets exist the job still runs green and skips the review, so a
# PR opened before the secrets are configured is not marked failed.

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  # pull_request_target (not pull_request) so the LLM secrets are available for
  # PRs opened from forks. This is safe here: the action checks out the trusted
  # base branch and fetches the PR head's blobs without executing any code
  # from the PR.
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  code-review:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OCR_LLM_URL: ${{ secrets.OCR_LLM_URL }}
      OCR_LLM_TOKEN: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
      OCR_LLM_MODEL: ${{ secrets.OCR_LLM_MODEL }}
    steps:
      - name: Check LLM configuration
        id: llm
        shell: bash
        run: |
          if [ -z "$OCR_LLM_URL" ] || [ -z "$OCR_LLM_TOKEN" ] || [ -z "$OCR_LLM_MODEL" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::LLM secrets are not configured (OCR_LLM_URL / OCR_LLM_AUTH_TOKEN / OCR_LLM_MODEL). Skipping the AI review; see app/README.md."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run OpenCodeReview
        if: steps.llm.outputs.configured == 'true'
        uses: alibaba/open-code-review@v1.13.7
        with:
          llm_url: ${{ secrets.OCR_LLM_URL }}
          llm_auth_token: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          llm_model: ${{ secrets.OCR_LLM_MODEL }}
          llm_use_anthropic: ${{ secrets.OCR_LLM_USE_ANTHROPIC || 'false' }}
          # Neutral request body: the action's default injects a provider-
          # specific "thinking" key that strict OpenAI-compatible endpoints
          # reject. Add provider-specific fields here if your model needs them.
          llm_extra_body: '{}'
          # Go gateway requirement: a stable session id per run (prompt-cache
          # routing). No custom User-Agent — OCR reserves that header.
          llm_extra_headers: 'x-opencode-session=ses_${{ github.run_id }}-${{ github.run_attempt }}'
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # One sticky summary comment per PR, rewritten on each push.
          sticky_summary: 'true'
          # Review only content new since the last checkpoint once the
          # initial full review is done — full re-reviews re-report every
          # deliberately-kept finding on each push. checkpoint_range makes a
          # full-coverage run record its head in the sticky summary, so the
          # next run reviews <checkpoint>..<head> only (fail-closed: any doubt
          # falls back to the full range).
          incremental: 'true'
          checkpoint_range: 'true'
          # Start in report mode: log what would be resolved, change nothing.
          resolve_outdated: 'report'
          upload_artifacts: 'true'
          review_task_timeout: '20'
